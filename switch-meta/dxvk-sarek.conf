dxvk.numCompilerThreads = 2
dxvk.numShaderCompilerThreads = 2
d3d9.maxFrameLatency = 1

dxvk.shaderCompilationMethod = async

# Avoid staging constant buffers on shared memory.
d3d9.deviceLocalConstantBuffers = False

# Cheaper shader maths: no D3D9 0 * inf = 0 emulation, plain pow.
d3d9.floatEmulation = False
d3d9.strictPow = False
